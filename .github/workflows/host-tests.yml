# Host unit tests for the pure relay policy (main/relay_policy.c), run with gcc.
# Every project on the branch that carries a copy is tested, and the copies
# must stay byte-identical (there is no shared component — see VARIANTS.md).
name: host-tests

on:
  pull_request:
  push:

jobs:
  relay-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Unity
        run: git clone --depth 1 --branch v2.6.0 https://github.com/ThrowTheSwitch/Unity.git /tmp/unity
      - name: Copies are identical
        run: |
          set -e
          copies=$(ls */main/relay_policy.c)
          echo "$copies"
          first=$(echo "$copies" | head -1)
          for f in $copies; do cmp "$first" "$f"; cmp "${first%.c}.h" "${f%.c}.h"; done
      - name: Run tests against each copy
        run: |
          set -e
          for src in $(dirname $(ls */main/relay_policy.c)); do
            echo "== $src"
            make -C tests/relay_policy clean run SRC="../../$src" UNITY=/tmp/unity/src
          done
